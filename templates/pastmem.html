<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Members | IEEE RAS EC Campus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0f1932 0%, #070a14 100%);
        }
        .members-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 8rem auto 5rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: color 0.25s ease;
        }
        .back-link:hover { color: #00f5ff; }
        .header-block {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 3.5rem auto;
        }
        .members-list-card {
            background: rgba(6, 9, 20, 0.85);
            border: 1px solid rgba(0, 245, 255, 0.15);
            border-radius: 20px;
            padding: 2rem 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .members-list-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .members-list-card li {
            color: #cbd5e1;
            font-size: 1rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(0, 245, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .members-list-card li:last-child { border-bottom: none; }
        .members-list-card li i {
            color: #00f5ff;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .members-wrapper {
                margin: 6rem auto 3rem auto;
                padding: 0 1.25rem;
            }
            .members-list-card {
                padding: 1.5rem 1.25rem;
            }
        }
    </style>
</head>
<body style="color: #fff; overflow-x: hidden;">

    <canvas id="bg-canvas"></canvas>

    <header class="navbar">
        <div class="logo-wrapper">
            <div class="logo-container">
                <img src="https://cdn.brandfetch.io/idyeOpla1i/w/128/h/47/theme/dark/logo.png?c=1bxid64Mup7aczewSAYMX&t=1781723057959" class="logo-img-ras">
                <div class="logo-divider"></div>
                <img src="https://cdn.brandfetch.io/idmoEW6P4D/w/155/h/72/theme/dark/logo.png?c=1bxid64Mup7aczewSAYMX&t=1718704217023" class="logo-img-pes">
            </div>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/events">Events</a>
            <a href="/team" class="active">Team</a>
        </nav>
    </header>

    <div class="members-wrapper">
        <a href="/team" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Team</a>

        <div class="header-block">
            <h2 class="section-title" style="margin: 0; font-size: 2.5rem; font-weight: 800;">Past Members</h2>
            <p style="color: #94a3b8; font-size: 1rem; margin-top: 1rem; line-height: 1.6;">Alumni of IEEE RAS PES EC Campus's executive committee and domain teams from previous years.</p>
        </div>

        <div class="members-list-card">
            <ul>
                <li><i class="fa-solid fa-user"></i>[ Past Member Name ]</li>
                <li><i class="fa-solid fa-user"></i>[ Past Member Name ]</li>
                <li><i class="fa-solid fa-user"></i>[ Past Member Name ]</li>
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let cx, cy, maxRadius;
        let sweepAngle = 0;
        let blips = [];

        function initRadar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
            maxRadius = Math.hypot(canvas.width, canvas.height) / 2;

            blips = [];
            const count = 26;
            for (let i = 0; i < count; i++) {
                blips.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: Math.random() * maxRadius * 0.92 + 30,
                    active: false,
                    opacity: 0
                });
            }
        }
        window.addEventListener('resize', initRadar);
        initRadar();

        function drawRings() {
            ctx.strokeStyle = 'rgba(0, 245, 255, 0.08)';
            ctx.lineWidth = 1;
            const ringCount = 6;
            for (let i = 1; i <= ringCount; i++) {
                ctx.beginPath();
                ctx.arc(cx, cy, (maxRadius / ringCount) * i, 0, Math.PI * 2);
                ctx.stroke();
            }
            // radial spokes
            const spokes = 12;
            for (let i = 0; i < spokes; i++) {
                const a = (Math.PI * 2 / spokes) * i;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(a) * maxRadius, cy + Math.sin(a) * maxRadius);
                ctx.stroke();
            }
        }

        function drawSweep() {
            const sweepWidth = Math.PI / 4;
            const grad = ctx.createConicGradient
                ? ctx.createConicGradient(sweepAngle - sweepWidth, cx, cy)
                : null;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, maxRadius, sweepAngle - sweepWidth, sweepAngle);
            ctx.closePath();

            if (grad) {
                grad.addColorStop(0, 'rgba(0, 245, 255, 0)');
                grad.addColorStop(1, 'rgba(0, 245, 255, 0.16)');
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = 'rgba(0, 245, 255, 0.08)';
            }
            ctx.fill();
            ctx.restore();

            // leading edge line
            ctx.strokeStyle = 'rgba(0, 245, 255, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(sweepAngle) * maxRadius, cy + Math.sin(sweepAngle) * maxRadius);
            ctx.stroke();
        }

        function angleDiff(a, b) {
            let d = Math.abs(a - b) % (Math.PI * 2);
            return d > Math.PI ? Math.PI * 2 - d : d;
        }

        function drawBlips() {
            blips.forEach(b => {
                if (!b.active && angleDiff(sweepAngle, b.angle) < 0.05) {
                    b.active = true;
                    b.opacity = 1;
                }
                if (b.active) {
                    const x = cx + Math.cos(b.angle) * b.radius;
                    const y = cy + Math.sin(b.angle) * b.radius;

                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 245, 255, ${b.opacity})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00f5ff';
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // expanding ping ring
                    ctx.beginPath();
                    ctx.arc(x, y, (1 - b.opacity) * 18, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 245, 255, ${b.opacity * 0.5})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    b.opacity -= 0.012;
                    if (b.opacity <= 0) b.active = false;
                }
            });
        }

        function renderRadar() {
            ctx.fillStyle = 'rgba(5, 8, 17, 0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawRings();
            drawSweep();
            drawBlips();

            sweepAngle += 0.012;
            if (sweepAngle > Math.PI * 2) sweepAngle -= Math.PI * 2;

            requestAnimationFrame(renderRadar);
        }
        renderRadar();
    </script>
</body>
</html>
