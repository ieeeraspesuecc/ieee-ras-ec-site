<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Members | IEEE RAS EC Campus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0f1932 0%, #070a14 100%);
        }
        .members-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 8rem auto 5rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: color 0.25s ease;
        }
        .back-link:hover { color: #00f5ff; }
        .header-block {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 3.5rem auto;
        }
        .members-list-card {
            background: rgba(6, 9, 20, 0.85);
            border: 1px solid rgba(0, 245, 255, 0.15);
            border-radius: 20px;
            padding: 2rem 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .members-list-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .members-list-card li {
            color: #cbd5e1;
            font-size: 1rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(0, 245, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .members-list-card li:last-child { border-bottom: none; }
        .members-list-card li i {
            color: #00f5ff;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .members-wrapper {
                margin: 6rem auto 3rem auto;
                padding: 0 1.25rem;
            }
            .members-list-card {
                padding: 1.5rem 1.25rem;
            }
        }
    </style>
</head>
<body style="color: #fff; overflow-x: hidden;">

    <canvas id="bg-canvas"></canvas>

    <header class="navbar">
        <div class="logo-wrapper">
            <div class="logo-container">
                <img src="https://cdn.brandfetch.io/idyeOpla1i/w/128/h/47/theme/dark/logo.png?c=1bxid64Mup7aczewSAYMX&t=1781723057959" class="logo-img-ras">
                <div class="logo-divider"></div>
                <img src="https://cdn.brandfetch.io/idmoEW6P4D/w/155/h/72/theme/dark/logo.png?c=1bxid64Mup7aczewSAYMX&t=1718704217023" class="logo-img-pes">
            </div>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/events">Events</a>
            <a href="/team" class="active">Team</a>
        </nav>
    </header>

    <div class="members-wrapper">
        <a href="/team" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Team</a>

        <div class="header-block">
            <h2 class="section-title" style="margin: 0; font-size: 2.5rem; font-weight: 800;">Current Members</h2>
            <p style="color: #94a3b8; font-size: 1rem; margin-top: 1rem; line-height: 1.6;">General body members of IEEE RAS PES EC Campus, beyond the executive committee and domain leads.</p>
        </div>

        <div class="members-list-card">
            <ul>
                <li><i class="fa-solid fa-user"></i>[ Member Name ]</li>
                <li><i class="fa-solid fa-user"></i>[ Member Name ]</li>
                <li><i class="fa-solid fa-user"></i>[ Member Name ]</li>
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        const maxDist = 150;
        let mouse = { x: null, y: null };

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            points = [];
            const count = Math.floor((canvas.width * canvas.height) / 18000);
            for (let i = 0; i < count; i++) {
                points.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1
                });
            }
        }

        window.addEventListener('resize', initCanvas);
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 180, 216, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 60;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function renderEngine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - p.x;
                    let dy = mouse.y - p.y;
                    let d = Math.hypot(dx, dy);
                    if (d < 200) {
                        p.x += dx * 0.02;
                        p.y += dy * 0.02;
                    }
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 180, 216, 0.6)';
                ctx.fill();

                for (let j = i + 1; j < points.length; j++) {
                    let p2 = points[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < maxDist) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 180, 216, ${0.25 * (1 - dist / maxDist)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(renderEngine);
        }

        initCanvas();
        renderEngine();
    </script>
</body>
</html>
