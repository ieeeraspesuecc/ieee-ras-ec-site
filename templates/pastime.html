<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Members | IEEE RAS EC Campus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: #020306;
        }
        .members-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 8rem auto 5rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: color 0.25s ease;
        }
        .back-link:hover { color: #00f5ff; }
        .header-block {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 3.5rem auto;
        }
        .members-list-card {
            background: rgba(6, 9, 20, 0.85);
            border: 1px solid rgba(0, 245, 255, 0.15);
            border-radius: 20px;
            padding: 2rem 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .members-list-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .members-list-card li {
            color: #cbd5e1;
            font-size: 1rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(0, 245, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .members-list-card li:last-child { border-bottom: none; }
        .members-list-card li i {
            color: #00f5ff;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .members-wrapper {
                margin: 6rem auto 3rem auto;
                padding: 0 1.25rem;
            }
            .members-list-card {
                padding: 1.5rem 1.25rem;
            }
        }
    </style>
</head>
<body style="color: #fff; overflow-x: hidden;">

    <canvas id="bg-canvas"></canvas>

    <header class="navbar">
        <div class="logo-wrapper">
            <div class="logo-container">
                <img src="https://cdn.brandfetch.io/idyeOpla1i/w/128/h/47/theme/dark/logo.png?c=1bxid64Mup7aczewSAYMX&t=1781723057959" class="logo-img-ras">
                <div class="logo-divider"></div>
                <img src="https://cdn.brandfetch.io/idmoEW6P4D/w/155/h/72/theme/dark/logo.png?c=1bxid64Mup7aczewSAYMX&t=1718704217023" class="logo-img-pes">
            </div>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/events">Events</a>
            <a href="/team" class="active">Team</a>
        </nav>
    </header>

    <div class="members-wrapper">
        <a href="/team" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Team</a>

        <div class="header-block">
            <h2 class="section-title" style="margin: 0; font-size: 2.5rem; font-weight: 800;">Past Members</h2>
            <p style="color: #94a3b8; font-size: 1rem; margin-top: 1rem; line-height: 1.6;">Alumni of IEEE RAS PES EC Campus's executive committee and domain teams from previous years.</p>
        </div>

        <div class="members-list-card">
            <ul>
                <li><i class="fa-solid fa-user"></i>[ Past Member Name ]</li>
                <li><i class="fa-solid fa-user"></i>[ Past Member Name ]</li>
                <li><i class="fa-solid fa-user"></i>[ Past Member Name ]</li>
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let vortexParticles = [];
        let mouse = { x: -500, y: -500 };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        resize();

        for(let i=0; i<150; i++) {
            vortexParticles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                speed: Math.random() * 0.5 + 0.2,
                size: Math.random() * 1.5 + 1
            });
        }

        function runSystem() {
            ctx.fillStyle = 'rgba(2, 3, 6, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            vortexParticles.forEach(p => {
                p.y -= p.speed;
                if(p.y < 0) p.y = canvas.height;

                let dist = Math.hypot(mouse.x - p.x, mouse.y - p.y);
                let currentX = p.x;
                if(dist < 200) {
                    let push = (200 - dist) * 0.08;
                    currentX += Math.cos(Math.atan2(p.y - mouse.y, p.x - mouse.x)) * push;
                }

                ctx.fillStyle = 'rgba(0, 245, 255, 0.35)';
                ctx.beginPath(); ctx.arc(currentX, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });

            requestAnimationFrame(runSystem);
        }
        runSystem();
    </script>
</body>
</html>
